[project]
name = "screentranslator-ml"
version = "0.1.0"
description = "Cyrillic-focused on-device OCR — training + export for the ScreenTranslator thesis."
requires-python = ">=3.11"
dependencies = [
  "torch>=2.3",
  "torchvision>=0.18",
  # trdg would go here but its PyPI release is yanked with malformed
  # metadata (arabic-reshaper==2.1.3 pin) and git HEAD is unfixed. We
  # roll our own Pillow-based synthetic generator instead (Task 5) —
  # simpler and avoids the arabic-reshaper + python-bidi deps we do
  # not need for a Cyrillic-only model.
  "nobuco>=0.13",
  "onnx>=1.16",
  "pyclipper>=1.3",
  "shapely>=2.0",
  "opencv-python-headless>=4.9",
  "pillow>=10.3",
  "numpy>=1.26",
  "tqdm>=4.66",
  "wandb>=0.17",
  "hydra-core>=1.3",
  "label-studio-sdk>=1.0",
  "requests>=2.31",
  "fonttools>=4.51",
  "datasets>=2.19",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]
